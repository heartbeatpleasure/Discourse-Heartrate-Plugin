plugins:
  live_metrics_enabled:
    default: true
    client: true

  live_metrics_nav_enabled:
    default: true
    client: true

  live_metrics_require_login_to_view_page:
    default: true
    client: false

  live_metrics_allow_anonymous_public_view:
    default: false
    client: false


  live_metrics_viewer_groups:
    default: ""
    type: list
    client: false

  live_metrics_allowed_sharer_groups:
    default: "trust_level_0"
    type: list
    client: false

  live_metrics_allowed_visibility_options:
    default: "private|specific_users|logged_in|public|staff"
    type: list
    client: false

  live_metrics_activity_enabled:
    default: true
    client: false
  live_metrics_activity_predefined_enabled:
    default: true
    client: false
  live_metrics_activity_custom_enabled:
    default: true
    client: false
  live_metrics_activity_details_enabled:
    default: true
    client: false
  live_metrics_activity_options:
    default: "Resting|Lying down|Sleeping|Taking a nap|Meditating|Working|Traveling|Walking|Leisurely cycling|Exercising|Doing chores|Eating|Gaming|Watching TV / a movie|Cuddling|NSFW"
    type: list
    client: false
  live_metrics_activity_max_text_length:
    default: 40
    type: integer
    min: 10
    max: 80
    client: false
  live_metrics_activity_expiry_mode:
    default: "user_selectable"
    type: enum
    choices:
      - disabled
      - fixed
      - user_selectable
    client: false
  live_metrics_activity_allow_no_expiry:
    default: false
    client: false
  live_metrics_activity_default_duration_minutes:
    default: 240
    type: integer
    min: 30
    max: 1440
    client: false
  live_metrics_activity_fixed_duration_minutes:
    default: 240
    type: integer
    min: 30
    max: 1440
    client: false
  live_metrics_activity_duration_overrides:
    default: "Sleeping:480|Taking a nap:60|Working:480|Traveling:240|Walking:120|Leisurely cycling:120|Exercising:180|Resting:120|Lying down:120|Meditating:120|Doing chores:120|Eating:60|Gaming:240|Watching TV / a movie:180|Cuddling:120|NSFW:120"
    type: list
    client: false

  live_metrics_directory_enabled:
    default: true
    client: true

  live_metrics_directory_limit:
    default: 50
    type: integer
    min: 1
    max: 200
    client: false

  live_metrics_poll_interval_seconds:
    default: 3
    type: integer
    min: 1
    max: 60
    client: true

  live_metrics_provider_refresh_interval_seconds:
    default: 3
    type: integer
    min: 1
    max: 60
    client: false

  live_metrics_async_current_readings_enabled:
    default: false
    client: false

  live_metrics_api_cache_seconds:
    default: 1
    type: integer
    min: 1
    max: 30
    client: false

  live_metrics_live_threshold_seconds:
    default: 20
    type: integer
    min: 3
    max: 120
    client: false

  live_metrics_stale_threshold_seconds:
    default: 60
    type: integer
    min: 10
    max: 600
    client: false

  live_metrics_statistics_enabled:
    default: false
    client: true

  live_metrics_pulsoid_enabled:
    default: true
    client: true

  live_metrics_pulsoid_client_id:
    default: ""
    type: string
    client: false

  live_metrics_pulsoid_client_secret:
    default: ""
    type: string
    secret: true
    client: false

  live_metrics_pulsoid_authorize_url:
    default: "https://pulsoid.net/oauth2/authorize"
    type: string
    client: false

  live_metrics_pulsoid_token_url:
    default: "https://pulsoid.net/oauth2/token"
    type: string
    client: false

  live_metrics_pulsoid_validate_token_url:
    default: "https://dev.pulsoid.net/api/v1/token/validate"
    type: string
    client: false

  live_metrics_pulsoid_revoke_url:
    default: "https://dev.pulsoid.net/oauth2/revoke"
    type: string
    client: false

  live_metrics_pulsoid_latest_url:
    default: "https://dev.pulsoid.net/api/v1/data/heart_rate/latest"
    type: string
    client: false

  live_metrics_pulsoid_statistics_url:
    default: "https://dev.pulsoid.net/api/v1/statistics"
    type: string
    client: false

  live_metrics_pulsoid_profile_url:
    default: "https://pulsoid.net/api/v1/profile"
    type: string
    client: false

  live_metrics_pulsoid_streaming_enabled:
    default: false
    client: false

  live_metrics_pulsoid_ws_url:
    default: "wss://dev.pulsoid.net/api/v1/data/real_time"
    type: string
    client: false

  live_metrics_pulsoid_max_streams:
    default: 100
    type: integer
    min: 1
    max: 500
    client: false

  live_metrics_pulsoid_stream_transport_timeout_seconds:
    default: 45
    type: integer
    min: 15
    max: 120
    client: false

  live_metrics_pulsoid_redirect_uri_override:
    default: ""
    type: string
    client: false

  live_metrics_hyperate_enabled:
    default: false
    client: true

  live_metrics_hyperate_api_key:
    default: ""
    type: string
    secret: true
    client: false

  live_metrics_hyperate_ws_url:
    default: "wss://app.hyperate.io/ws/:deviceId"
    type: string
    client: false

  live_metrics_hyperate_streaming_enabled:
    default: false
    client: false

  live_metrics_hyperate_max_streams:
    default: 100
    type: integer
    min: 1
    max: 500
    client: false

  live_metrics_hyperate_stream_stall_timeout_seconds:
    default: 45
    type: integer
    min: 10
    max: 120
    client: false

  live_metrics_hyperate_read_timeout_seconds:
    default: 15
    type: integer
    min: 2
    max: 30
    client: false

